spring.application.name=ServidorLocalUrna
server.address=0.0.0.0
server.port=${PORT:8080}

# ── PostgreSQL local ──────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/votacion_local}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── CouchDB ───────────────────────────────────────────────
couchdb.url=${COUCHDB_URL:http://localhost:5984}
couchdb.username=${COUCHDB_USER:admin}
couchdb.password=${COUCHDB_PASSWORD:admin123}
couchdb.database.urna=${COUCHDB_DB_URNA:votos_urna}

# ── CORS: abierto para toda la LAN ───────────────────────
config.cors.allowed-origins=*

# ── Logging ───────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.vote4tech=DEBUG
